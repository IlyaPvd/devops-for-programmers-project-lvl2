- hosts: webservers
  roles:
    - geerlingguy.pip
    - datadog.dd.agent
  tasks:
    - name: Create env file
      ansible.builtin.template:
        src: ./templates/.env.j2
        dest: /etc/redmine.env

    - name: Run Redmine in Docker container
      community.docker.docker_container:
        image: redmine
        name: redmine
        ports:
          - "80:3000"
        env_file: /etc/redmine.env